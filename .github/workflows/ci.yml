name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Check out the post-merge state on PRs so CI validates what will land on main,
# not just the branch tip. Falls back to the commit SHA on push/workflow_dispatch.
env:
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

permissions:
  contents: read
  id-token: write

jobs:
  # Work out which parts of the repo changed, so docs-only changes can skip the
  # expensive build and test jobs.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # A file counts as "code" only if it matches every pattern below, i.e.
          # it is anything other than documentation.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'

  rust:
    name: Rust (cargo test + llvm-cov)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          path: pish

      - uses: actions/checkout@v4
        with:
          repository: nakomis/rotary-dial
          ref: chore/make-public
          path: rotary-dial

      - name: Configure AWS credentials (CodeArtifact)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::975050268859:role/nakomis-pish-github-ci-sandbox
          aws-region: eu-west-2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libwayland-dev libxkbcommon-x11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pish/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('pish/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Build
        working-directory: pish
        run: cargo build --workspace

      - name: Test + coverage (pish-core)
        working-directory: pish
        run: cargo llvm-cov --package pish-core --lcov --output-path lcov.info

      - name: Check coverage threshold (70%)
        working-directory: pish
        run: cargo llvm-cov report --package pish-core --fail-under-lines 70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: pish/lcov.info

  # Single required status check for branch protection. Always runs and reports a
  # result: passes when every job succeeded or was skipped by the path filter, and
  # fails if any job failed or was cancelled.
  ci-status:
    name: CI Status
    if: always()
    needs: [changes, rust]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          echo "changes: ${CHANGES_RESULT}"
          echo "rust:    ${RUST_RESULT}"
          if [ "${CHANGES_RESULT}" != "success" ]; then
            echo "::error::Change detection did not succeed (${CHANGES_RESULT})"
            exit 1
          fi
          case "${RUST_RESULT}" in
            success|skipped) ;;
            *)
              echo "::error::Rust job did not succeed (${RUST_RESULT})"
              exit 1
              ;;
          esac
          echo "All required jobs passed or were skipped."
